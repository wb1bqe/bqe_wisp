
# Every entry must have a unique nickname which is used to search for the 
# data record.  (This allows for multiple entries for a satellite with different
# downlink frequencies etc.)

satellites:
    # Optional per-entry SSTV receiver (automatically opens a live image page):
    # decode_sstv_images: true  # uses radio_soundcard from my_rig.yaml
    # decode_telemetry: true    # uses radio_soundcard from my_rig.yaml
    # decode_ssdv_images: true # RS61 Geoscan images; uses radio_soundcard.

    # Every satellite pass defaults to minimum squelch and disabled AGC.
    # Optional per-entry overrides:
    # squelch_level: 0.0  # 0.0 to 1.0; default: 0.0 (minimum).
    # agc: medium  # fast, medium, slow, or disabled; default: disabled.

    #https://www.amsat.se/2024/11/29/asrtu-1-designated-asrtu-oscar-123/  sstv
  - nickname: "ao-123"
    satellite_type: "FM Voice"
    satellite_name: "AO-123"
    catalog_number: '61781'
    satellite_mode_required: True
    downlink_frequency_mhz: '435.400'
    downlink_mode: 'FM'
    uplink_frequency_mhz: '145.850'
    uplink_mode: 'FM'
    bandwidth: '16000'
    ctcss_tone: '67.0'
    enable_antenna_tracking: False
    enable_tuning: True
    priority: '3'
    auto_schedule: True

